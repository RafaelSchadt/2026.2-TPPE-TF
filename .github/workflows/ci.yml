name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar dependências com versões fixadas
        run: |
          mkdir -p libs
          curl -fsSL -o libs/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o libs/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl -fsSL -o libs/h2-2.3.232.jar https://repo1.maven.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar

      - name: Verificar integridade SHA-256
        run: |
          echo "8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  libs/junit-4.13.2.jar" | sha256sum -c -
          echo "66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  libs/hamcrest-core-1.3.jar" | sha256sum -c -
          echo "8dae62d22db8982c3dcb3826edb9c727c5d302063a67eef7d63d82de401f07d3  libs/h2-2.3.232.jar" | sha256sum -c -

      - name: Compilar e executar testes
        run: |
          chmod +x build.sh test.sh
          ./test.sh
